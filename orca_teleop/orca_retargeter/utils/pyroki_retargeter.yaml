use_scalar_distance_palm: False
loss_coeffs: [5.0, 5.0, 5.0, 5.0, 5.0]

# LM solver settings
max_iterations: 20
trust_region_lambda_initial: 1.0
linear_solver: "dense_cholesky"

# Temporal smoothness (0 = disabled, start with this for fair comparison)
smoothness_weight: 0.0

joint_regularizers:  # tuples (joint_name, zero_value, weight) for regularizing joints to zero
  # Abduction → 0
  - [thumb_abd, 0, 0]
  - [index_abd, 0,  0]
  - [middle_abd, 0, 0]
  - [ring_abd, 0, 0]
  - [pinky_abd, 0, 0]
  # Flexion → 0 (proximal-first hierarchy: PIP penalized 5x more than MCP)
  - [thumb_cmc, 0, 0]
  - [thumb_mcp, 0, 0]
  - [thumb_dip, 0, 0]
  - [index_mcp, 0, 0]
  - [index_pip, 0, 0]
  - [middle_mcp, 0, 0]
  - [middle_pip, 0, 0]
  - [ring_mcp, 0, 0]
  - [ring_pip, 0, 0]
  - [pinky_mcp, 0, 0]
  - [pinky_pip, 0, 0]
